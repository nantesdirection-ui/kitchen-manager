<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { color: #333; margin: 20px 0; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin: 10px 0; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍳 Kitchen Manager - CRM Cuisines Équipées</h1>
        <div class="box">
            <p>✅ Serveur fonctionne!</p>
            <button onclick="testAPI()">Tester l'API</button>
        </div>
        <div id="result" class="box" style="display:none;"></div>
    </div>

    <script>
        function testAPI() {
            fetch('/api/test')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('result').style.display = 'block';
                    document.getElementById('result').innerHTML = '<p>' + data.message + '</p>';
                })
                .catch(err => console.error(err));
        }
    </script>
</body>
</html>
